name: Debug Yahoo Timeseries
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Yahoo cookie, crumb, and fundamentals-timeseries
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          COOKIE=$(curl -sS -D - -o /dev/null -A "$UA" https://fc.yahoo.com | grep -i '^set-cookie' | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: ?//' | cut -d';' -f1)
          echo "Cookie obtained: ${COOKIE:0:20}..."
          CRUMB=$(curl -sS -A "$UA" -H "Cookie: $COOKIE" "https://query1.finance.yahoo.com/v1/test/getcrumb")
          echo "Crumb: $CRUMB"
          echo "=== TIMESERIES RESPONSE ==="
          curl -sS -A "$UA" -H "Cookie: $COOKIE" "https://query2.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/AAPL?symbol=AAPL&type=annualFreeCashFlow,annualTotalDebt,annualStockholdersEquity&period1=1451606400&period2=1893456000&crumb=$CRUMB"
          echo ""
          echo "=== QUOTESUMMARY balanceSheetHistory/cashflowStatementHistory ==="
          curl -sS -A "$UA" -H "Cookie: $COOKIE" "https://query2.finance.yahoo.com/v10/finance/quoteSummary/AAPL?modules=balanceSheetHistory,cashflowStatementHistory&crumb=$CRUMB"
